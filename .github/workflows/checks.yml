name: Checks
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint:plugin
      - run: pnpm build
